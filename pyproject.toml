[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kilm"
version = "0.5.6"
description = "A command-line tool for managing KiCad libraries across projects and workstations"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Blaž Aristovnik", email = "blaz@paxia.co" },
]
maintainers = [
    { name = "Blaž Aristovnik", email = "blaz@paxia.co" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Natural Language :: English",
    "Environment :: Console",
]
keywords = [
    "kicad",
    "library-management",
    "eda",
    "electronics",
    "pcb-design",
    "cli",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "typer>=0.17.4",
    "rich>=14.0.0",
    "packaging>=25.0",
    "pyyaml>=6.0",
    "pathspec>=0.12.1",
    "jinja2>=3.1.6",
    "questionary>=1.10.0",
    "requests>=2.32.4",
    "typing-extensions>=4.4.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[project.urls]
Homepage = "https://github.com/barisgit/KiLM"
Documentation = "https://kilm.aristovnik.me"
Repository = "https://github.com/barisgit/KiLM"
"Bug Tracker" = "https://github.com/barisgit/KiLM/issues"

[project.scripts]
kilm = "kicad_lib_manager.main:app"

[tool.uv]
# Oldest uv verified with this lockfile; CI pins an exact version.
required-version = ">=0.9.8"

[tool.hatch.build.targets.wheel]
packages = ["kicad_lib_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Release workflow scripts are tested as top-level modules.
pythonpath = [".github/scripts"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is opt-in (`just cov`) so the default run stays fast and writes no reports.
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.ty.environment]
# Matches pytest's pythonpath so the tests of .github/scripts resolve.
extra-paths = [".github/scripts"]

[tool.ty.rules]
# Every rule, including those off by default, fails the check.
all = "error"

[tool.ty.analysis]
# Only rule-specific `# ty: ignore[rule]` comments suppress diagnostics.
respect-type-ignore-comments = false
# Sound narrowing: no literal narrowing from `==`, no assumptions about
# unspecialized generics in isinstance checks.
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
# Preview complexity limits, opted into one by one so other preview rules and
# preview behavior stay off.
preview = true
explicit-preview-rules = true
extend-select = [
    "PLR0904", # too-many-public-methods
    "PLR0914", # too-many-locals
    "PLR0916", # too-many-boolean-expressions
    "PLR1702", # too-many-nested-blocks
]
ignore = [
    # Conflicts with ruff format, which owns trailing commas.
    "COM812",
    # Licensing is stated once in LICENSE and pyproject.toml; a per-file
    # copyright header would repeat it in every module.
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# pytest reports failures through plain asserts, and expected values in tests
# are the specification, not magic numbers.
"tests/**" = ["S101", "PLR2004"]
# Standalone scripts that release.yml runs by path; tests import them as
# top-level modules through pytest's pythonpath, not as a package.
".github/scripts/*.py" = ["INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# Ruff's defaults, stated so they are visible and only ever tightened.
max-args = 5
max-positional-args = 5
max-branches = 12
max-returns = 6
max-statements = 50
max-locals = 15
max-nested-blocks = 5
max-bool-expr = 5
max-public-methods = 20

[tool.coverage.run]
source = ["kicad_lib_manager"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
# Measured 45.5% when coverage became opt-in; raise it as tests are added.
fail_under = 45
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]