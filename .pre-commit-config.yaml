# Hooks run the tool versions locked in uv.lock through `uv run`, so they match
# `just check` and CI on every OS. `just setup` installs them. Tests stay out of
# the hook to keep commits fast; `just check` runs them.
minimum_pre_commit_version: "4.4.0"
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: unsupported
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --locked ruff check --fix
        language: unsupported
        types_or: [python, pyi]
      - id: ty
        name: ty check
        entry: uv run --locked ty check
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false
